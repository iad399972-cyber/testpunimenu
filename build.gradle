plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.punimenu'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.punimenu'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
